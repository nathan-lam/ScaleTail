configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:1200"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  # Redis cache container for RSSHub
  rsshub-redis:
    image: redis:alpine
    container_name: redis-${SERVICE}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    networks:
      - internal-net

  # Tailscale Sidecar Configuration
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-${SERVICE}
    hostname: ${SERVICE}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ./config:/config
      - ./ts/state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - internal-net

  # RSSHub Application Sidecar Service
  application:
    image: ${IMAGE_URL} # e.g., diygod/rsshub:latest
    network_mode: service:tailscale
    container_name: app-${SERVICE}
    environment:
      - NODE_ENV=production
      - CACHE_TYPE=redis
      - REDIS_URL=redis://127.0.0.1:6379
      - TWITTER_AUTH_TOKEN=${RSS_TWITTER_AUTH_TOKEN}
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    depends_on:
      tailscale:
        condition: service_healthy
      rsshub-redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "pgrep", "-f", "node"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

networks:
  internal-net:
    driver: bridge