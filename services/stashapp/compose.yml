configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:9999"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-${SERVICE}
    hostname: ${SERVICE}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_ACCEPT_DNS=true
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ./${SERVICE}-data/config:/config
      - ./${SERVICE}-data/tailscale/state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

  application:
    image: ${IMAGE_URL}
    network_mode: service:tailscale
    container_name: app-${SERVICE}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 2048M
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - STASH_STASH=/data
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      - STASH_CONFIG_FILE=/config/config.yml
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./${SERVICE}-data/config:/config
      - ./${SERVICE}-data/metadata:/metadata
      - ./${SERVICE}-data/cache:/cache
      - ./${SERVICE}-data/blobs:/blobs
      - ./${SERVICE}-data/generated:/generated
      - ${STASH_MEDIA_PATH}:/data
    depends_on:
      tailscale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "stash"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
      